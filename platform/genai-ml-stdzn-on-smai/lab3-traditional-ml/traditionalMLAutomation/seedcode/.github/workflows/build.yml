name: BuildSageMakerModel

on:
  push:
    branches:
      - main
    paths:
      - model_build/ml_pipelines/**
      - model_build/source_scripts/**
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
  SAGEMAKER_PROJECT_NAME: ${{ secrets.SAGEMAKER_PROJECT_NAME }}

jobs:
  Build:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r model_build/requirements.txt

      - name: Configure AWS Credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_GITHUB_WORKFLOW }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SageMaker Pipeline
        run: |
          export SAGEMAKER_PROJECT_ID=$(aws sagemaker describe-project \
            --project-name ${{ env.SAGEMAKER_PROJECT_NAME }} \
            --query ProjectId \
            --output text)
          export SAGEMAKER_PROJECT_ARN=$(aws sagemaker describe-project \
            --project-name ${{ env.SAGEMAKER_PROJECT_NAME }} \
            --query ProjectArn \
            --output text)
          export ARTIFACT_BUCKET=sagemaker-project-github-$SAGEMAKER_PROJECT_ID-${{ env.AWS_REGION }}
          export SAGEMAKER_PROJECT_NAME_ID="${{ env.SAGEMAKER_PROJECT_NAME }}-$SAGEMAKER_PROJECT_ID"
          
          # Use custom model package group name if provided, otherwise use project-based name
          export MODEL_PACKAGE_GROUP_NAME="${{ secrets.MODEL_PACKAGE_GROUP_NAME }}"
          if [ -z "$MODEL_PACKAGE_GROUP_NAME" ]; then
            MODEL_PACKAGE_GROUP_NAME="${SAGEMAKER_PROJECT_NAME_ID}"
          fi
          export SAGEMAKER_PIPELINE_ROLE_ARN=${{ secrets.SAGEMAKER_PIPELINE_ROLE_ARN }}
          export PYTHONPATH="${PYTHONPATH}:${PWD}/model_build"
          
          cd model_build
          
          # Build kwargs with optional MLflow parameters
          KWARGS="{\"region\":\"${{ env.AWS_REGION }}\",\"sagemaker_project_arn\":\"${SAGEMAKER_PROJECT_ARN}\",\"role\":\"${SAGEMAKER_PIPELINE_ROLE_ARN}\",\"default_bucket\":\"${ARTIFACT_BUCKET}\",\"pipeline_name\":\"${SAGEMAKER_PROJECT_NAME_ID}\",\"model_package_group_name\":\"${MODEL_PACKAGE_GROUP_NAME}\",\"base_job_prefix\":\"${SAGEMAKER_PROJECT_NAME_ID}\",\"glue_database_name\":\"${{ secrets.GLUE_DATABASE }}\",\"glue_table_name\":\"${{ secrets.GLUE_TABLE }}\""
          
          # Add MLflow parameters if configured
          if [ -n "${{ secrets.MLFLOW_TRACKING_URI }}" ]; then
            KWARGS="${KWARGS},\"mlflow_tracking_uri\":\"${{ secrets.MLFLOW_TRACKING_URI }}\""
          fi
          if [ -n "${{ secrets.MLFLOW_EXPERIMENT_NAME }}" ]; then
            KWARGS="${KWARGS},\"mlflow_experiment_name\":\"${{ secrets.MLFLOW_EXPERIMENT_NAME }}\""
          fi
          KWARGS="${KWARGS}}"
          
          python ml_pipelines/run_pipeline.py \
            --module-name training.pipeline \
            --role-arn ${SAGEMAKER_PIPELINE_ROLE_ARN} \
            --tags "[{\"Key\":\"sagemaker:project-name\", \"Value\":\"${{ env.SAGEMAKER_PROJECT_NAME }}\"}, {\"Key\":\"sagemaker:project-id\", \"Value\":\"${SAGEMAKER_PROJECT_ID}\"}]" \
            --kwargs "${KWARGS}"
